<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events • Campus Club Directory</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="nav-container">
      <a class="logo" href="index.html">Campus Club Directory</a>
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search clubs, events..." />
        <i class="fas fa-search search-icon"></i>
      </div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="clubs.html">Clubs</a>
        <a href="events.html" class="active">Events</a>
      </div>
      <div style="display:flex;align-items:center;gap:20px">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <button class="account-btn" onclick="openModal('authModal')">Account</button>
        <span class="user-name" id="userWelcome"></span>
      </div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="clubs.html">Clubs</a>
    <a href="events.html">Events</a>
    <div style="margin:30px auto;width:85%">
      <input type="text" id="mobileSearch" placeholder="Search..." />
    </div>
  </div>

  <!-- Events Section -->
  <section id="events" class="section active">
    <h2>Upcoming Events</h2>
    <div class="cards" id="eventList"></div>
    <div class="add-btn" onclick="openAddModal('event')"><i class="fas fa-plus"></i> Add Event</div>
  </section>

  <!-- Event Modal -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('eventModal')">×</span>
      <h2 id="eventName"></h2>
      <div class="modal-info">
        <p><strong>Date:</strong> <span id="eventDate"></span></p>
        <p><strong>Time:</strong> <span id="eventTime"></span></p>
        <p><strong>Location:</strong> <span id="eventLocation"></span></p>
        <p style="margin-top:20px" id="eventDesc"></p>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:16px;margin-top:25px">RSVP Now</button>
    </div>
  </div>

  <!-- Add Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('addModal')">×</span>
      <h2 id="addModalTitle">Register New Event</h2>
      <form id="addForm">
        <input type="text" id="addName" placeholder="Name" required />
        <textarea id="addDesc" placeholder="Description" required></textarea>
        <input type="text" id="addExtra1" placeholder="Date" required />
        <input type="text" id="addExtra2" placeholder="Time" />
        <input type="text" id="addExtra3" placeholder="Location" />
        <!-- hidden topic field remains for JS consistency -->
        <select id="addTopic" style="display:none">
          <option value="Other">Other</option>
        </select>
        <input type="text" id="addTelegram" placeholder="Telegram Link (optional)" />
        <input type="text" id="addLinkedin" placeholder="LinkedIn Link (optional)" />
        <input type="hidden" id="addType" value="event">
        <button type="submit" class="btn btn-primary" style="width:100%;padding:16px;margin-top:15px">Add</button>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('authModal')">×</span>
      <h2 id="modalTitle">Welcome Back!</h2>
      <form id="authForm">
        <input type="text" id="username" placeholder="Username" required />
        <div id="emailField" style="display:none">
          <input type="email" id="email" placeholder="Email" />
        </div>
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p style="margin-top:20px">
        <a href="#" onclick="switchMode()">Don't have an account? Sign Up</a>
      </p>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 Campus Club Directory. All rights reserved.</p>
    <p>
      <a href="#">Privacy Policy</a> • 
      <a href="#">Terms of Service</a> • 
      <a href="#">Contact</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
